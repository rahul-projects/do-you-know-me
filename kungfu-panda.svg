<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Body/Head Outline -->
  <circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>

  <!-- Left Ear -->
  <circle cx="20" cy="20" r="15" fill="#000000" />

  <!-- Right Ear -->
  <circle cx="80" cy="20" r="15" fill="#000000" />

  <!-- Left Eye Patch -->
  <ellipse cx="35" cy="45" rx="15" ry="20" fill="#000000" transform="rotate(-20 35 45)" />

  <!-- Right Eye Patch -->
  <ellipse cx="65" cy="45" rx="15" ry="20" fill="#000000" transform="rotate(20 65 45)" />

  <!-- Left Eye Inner -->
  <circle cx="35" cy="45" r="5" fill="#FFFFFF" />
  <circle cx="35" cy="45" r="2" fill="#000000" />

  <!-- Right Eye Inner -->
  <circle cx="65" cy="45" r="5" fill="#FFFFFF" />
  <circle cx="65" cy="45" r="2" fill="#000000" />

  <!-- Nose -->
  <path d="M 45 65 Q 50 70 55 65 Z" fill="#000000" />

  <!-- Mouth / Smile -->
  <path d="M 40 75 Q 50 85 60 75" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />

  <!-- Kung Fu Headband -->
  <path d="M 5 35 Q 50 20 95 35" fill="none" stroke="#FF0000" stroke-width="6" stroke-linecap="round" />
  <!-- Headband Knot/Tails -->
  <path d="M 90 35 Q 95 45 100 50" fill="none" stroke="#FF0000" stroke-width="6" stroke-linecap="round" />
  <path d="M 90 35 Q 98 30 105 25" fill="none" stroke="#FF0000" stroke-width="6" stroke-linecap="round" />
</svg>
